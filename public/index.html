<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankenstein Monitor</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #00ff41;
            --accent-glow: rgba(0, 255, 65, 0.4);
            --danger-color: #ff3333;
            --danger-glow: rgba(255, 51, 51, 0.4);
            --warning-color: #ffaa00;
            --panel-bg: rgba(18, 18, 18, 0.95);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Scanline effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            opacity: 0.3;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 8px;
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--accent-glow);
            font-size: 2em;
            animation: flicker 3s infinite alternate;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.95; }
        }

        #monitor-container {
            position: relative;
            border: 5px solid #333;
            padding: 15px;
            background: #000;
            box-shadow: 
                0 0 30px var(--accent-glow),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
            border-radius: 4px;
            max-width: 100%;
        }

        video {
            width: 100%;
            max-width: 640px;
            height: auto;
            aspect-ratio: 4/3;
            display: block;
            filter: grayscale(100%) contrast(1.3) brightness(0.9);
            border: 2px solid #1a1a1a;
        }

        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--accent-color);
            font-size: 13px;
            background: var(--panel-bg);
            padding: 8px 12px;
            border: 1px solid var(--accent-color);
            border-radius: 2px;
            text-shadow: 0 0 5px var(--accent-glow);
            backdrop-filter: blur(5px);
            font-weight: bold;
        }

        #stats-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            padding: 10px 15px;
            border: 1px solid var(--accent-color);
            border-radius: 2px;
            font-size: 11px;
            backdrop-filter: blur(5px);
            min-width: 150px;
        }

        #stats-panel div {
            margin: 3px 0;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        #stats-panel .label {
            color: #888;
        }

        #stats-panel .value {
            color: var(--accent-color);
            font-weight: bold;
        }

        #status {
            margin-top: 25px;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            padding: 15px 30px;
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 4px;
            min-width: 400px;
            text-shadow: 0 0 10px currentColor;
        }

        .stress-high {
            color: var(--danger-color);
            border-color: var(--danger-color);
            animation: pulse 1s infinite, shake 0.5s infinite;
            box-shadow: 0 0 20px var(--danger-glow);
        }

        .stress-normal {
            color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        #controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 12px 25px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            font-weight: bold;
        }

        button::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: var(--accent-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
            z-index: -1;
        }

        button:hover:not(:disabled)::before {
            width: 300px;
            height: 300px;
        }

        button:hover:not(:disabled) {
            color: #000;
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        #testBtn {
            border-color: var(--warning-color);
            color: var(--warning-color);
        }

        #testBtn::before {
            background: var(--warning-color);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
                letter-spacing: 4px;
            }

            #status {
                font-size: 18px;
                min-width: auto;
                width: 100%;
            }

            button {
                padding: 10px 20px;
                font-size: 13px;
            }

            #overlay {
                font-size: 11px;
                padding: 6px 10px;
            }

            #stats-panel {
                font-size: 10px;
                padding: 8px 12px;
            }
        }

        /* Connection indicator */
        .connection-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            margin-left: 8px;
            animation: blink 2s infinite;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>

<body>

    <h1>Subject Monitoring<span class="connection-dot"></span></h1>

    <div id="monitor-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay">SYSTEM: ONLINE</div>
        <div id="stats-panel">
            <div><span class="label">FPS:</span><span class="value" id="fps">--</span></div>
            <div><span class="label">FACES:</span><span class="value" id="faceCount">0</span></div>
            <div><span class="label">STRESS:</span><span class="value" id="stressLevel">--</span></div>
        </div>
    </div>

    <div id="status">STATUS: AWAITING INPUT</div>

    <div id="controls">
        <button id="loginBtn" onclick="window.location.href='/login'">CONNECT SPOTIFY</button>
        <button id="startBtn">INITIALIZE MONITORING</button>
        <button id="stopBtn" disabled>TERMINATE</button>
        <button id="testBtn">TEST AUDIO</button>
    </div>
    
    <div id="connection-status" style="margin-top: 15px; font-size: 12px; color: #888;"></div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
