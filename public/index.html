<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frankenstein Monitor</title>
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --accent-color: #00ff41;
            /* Matrix green / Industrial */
            --danger-color: #ff3333;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            /* Industrial feel */
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            text-transform: uppercase;
            letter-spacing: 5px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        #monitor-container {
            position: relative;
            border: 4px solid #333;
            padding: 10px;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        video {
            width: 640px;
            height: 480px;
            display: block;
            filter: grayscale(100%) contrast(1.2);
            /* Gritty look */
        }

        #overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--accent-color);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
        }

        #status {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .stress-high {
            color: var(--danger-color);
            animation: pulse 1s infinite;
        }

        .stress-normal {
            color: var(--accent-color);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        #controls {
            margin-top: 20px;
        }

        button {
            background: transparent;
            border: 2px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px 20px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--accent-color);
            color: #000;
        }

        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h1>Subject Monitoring</h1>

    <div id="monitor-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="overlay">SYSTEM: ONLINE</div>
    </div>

    <div id="status">STATUS: AWAITING INPUT</div>

    <div id="controls">
        <button id="startBtn">INITIALIZE MONITORING</button>
        <button id="stopBtn" disabled>TERMINATE</button>
        <button id="testBtn">TEST AUDIO</button>
    </div>

    <!-- Hidden YouTube Player -->
    <div id="player" style="position: absolute; top: -9999px; left: -9999px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
